basePath: /
definitions:
  github_com_habibmrizki_shorlink-be_internal_dto.CreateLinkRequest:
    properties:
      custom_slug:
        type: string
      original_url:
        type: string
      slug:
        type: string
    required:
    - original_url
    type: object
  github_com_habibmrizki_shorlink-be_internal_dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  github_com_habibmrizki_shorlink-be_internal_dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  github_com_habibmrizki_shorlink-be_internal_models.Response:
    properties:
      message:
        type: string
      results: {}
      success:
        type: boolean
    type: object
host: localhost:2901
info:
  contact: {}
  description: API for user authentication, short link management, and URL redirection.
  title: Shortlink API
  version: "1.0"
paths:
  /{slug}:
    get:
      parameters:
      - description: Short link slug
        in: path
        name: slug
        required: true
        type: string
      responses:
        "301":
          description: Moved Permanently
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
      summary: Redirect to original URL
      tags:
      - redirect
  /api/links:
    get:
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page limit
        in: query
        name: limit
        type: integer
      - description: Show soft-deleted links
        in: query
        name: show_deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
      security:
      - BearerAuth: []
      summary: Get user's links
      tags:
      - links
    post:
      consumes:
      - application/json
      parameters:
      - description: Original URL and optional custom slug
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_dto.CreateLinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
      security:
      - BearerAuth: []
      summary: Create a short link
      tags:
      - links
  /api/links/{id}:
    delete:
      parameters:
      - description: Link ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
      security:
      - BearerAuth: []
      summary: Delete a link
      tags:
      - links
  /api/links/check:
    get:
      parameters:
      - description: Slug to check
        in: query
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
      security:
      - BearerAuth: []
      summary: Check slug availability
      tags:
      - links
  /api/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
      summary: Log in
      tags:
      - auth
  /api/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - auth
  /api/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_habibmrizki_shorlink-be_internal_models.Response'
      summary: Register a user
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
