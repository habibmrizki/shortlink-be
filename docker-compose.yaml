services:
  shortlink-fe:
    image: ghcr.io/habibmrizki/shortlink-fe:latest
    pull_policy: always
    container_name: shortlink-fe
    restart: unless-stopped
    ports:
      - "5174:80"
    networks:
      - shortlink-app
    depends_on:
      - shortlink-be

  shortlink-be:
    image: ghcr.io/habibmrizki/shortlink-be:latest
    pull_policy: always
    container_name: shortlink-be
    restart: unless-stopped
    ports:
      - "2901:2901"
    env_file:
      - .env
    environment:
      DBHOST: shortlink-pg
      DBPORT: "5432"
      REDIS_HOST: shortlink-rdb
      REDIS_PORT: "6379"
      GODEBUG: "netdns=go"
    networks:
      - shortlink-app
      - shortlink-data
    depends_on:
      shortlink-pg:
        condition: service_healthy
      shortlink-rdb:
        condition: service_started

  shortlink-pg:
    image: postgres:17-alpine3.21
    container_name: shortlink-pg
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - shortlink-pg-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - shortlink-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habib -d shortlink"]
      interval: 3s
      timeout: 3s
      retries: 5

  shortlink-rdb:
    image: redis:8.2-alpine
    container_name: shortlink-rdb
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - shortlink-redis-data:/data
    networks:
      - shortlink-data

volumes:
  shortlink-pg-data:
  shortlink-redis-data:

networks:
  shortlink-app:
    driver: bridge
  shortlink-data:
    driver: bridge
